name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "review/**"
      - "project-tree.txt"
      - "*.md"
  push:
    branches:
      - development
      - main
    paths-ignore:
      - "docs/**"
      - "review/**"
      - "project-tree.txt"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DEBUG: "false"
  ENVIRONMENT: "development"
  SECRET_KEY: "ci-secret-key"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  NEXUSOPS_MASTER_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  backend-quality:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall -q backend scripts

      - name: Install lint tooling
        run: python -m pip install "ruff>=0.5.7"

      - name: Backend lint
        run: python -m ruff check backend scripts

      - name: Artifact hygiene
        run: python scripts/check_artifact_hygiene.py

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run SQLite-backed backend tests
        run: python -m pytest backend/tests -q

  backend-migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexusops_ci
          POSTGRES_USER: nexusops
          POSTGRES_PASSWORD: nexusops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusops -d nexusops_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nexusops:nexusops@localhost:5432/nexusops_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Alembic single-head validation
        run: |
          heads="$(python -m alembic heads | wc -l)"
          test "$heads" -eq 1

      - name: Alembic upgrade validation
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Alembic downgrade smoke validation
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend dependency audit
        working-directory: frontend
        # Production dependencies only: build tooling is not shipped to users.
        # Advisory, not blocking, so a fresh disclosure cannot wedge deploys.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-quality
      - backend-tests
      - backend-migrations
      - frontend
    if: always()
    steps:
      - name: Check required jobs
        run: |
          test "${{ needs.backend-quality.result }}" = "success"
          test "${{ needs.backend-tests.result }}" = "success"
          test "${{ needs.backend-migrations.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"

  staging-deploy:
    name: Validate and deploy hds-lab
    runs-on:
      - self-hosted
      - hds-lab
    timeout-minutes: 45
    needs:
      - ci-summary
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && vars.ENABLE_HDS_LAB_DEPLOY == 'true'
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set executable permissions
        run: chmod +x scripts/*.sh

      - name: Ensure runner dependencies
        run: ./scripts/ensure-runner-env.sh

      - name: Create staging env file
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE || secrets.NEXUSOPS_STAGING_ENV_FILE }}
        run: |
          if [[ -z "$STAGING_ENV_FILE" ]]; then
            echo "STAGING_ENV_FILE is empty or unavailable to this workflow." >&2
            echo "Create an environment or repository secret named STAGING_ENV_FILE." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$STAGING_ENV_FILE" > .env

      - name: Validate Docker Compose config
        run: ./scripts/deploy.sh --config-only

      - name: Deploy stack
        run: ./scripts/deploy.sh
