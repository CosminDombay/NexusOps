name: NexusOps Production Deployment

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose the production deployment task."
        required: true
        default: "validate-and-deploy"
        type: choice
        options:
          - validate-and-deploy
          - deploy-only

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PRODUCTION_ROOT: /opt/nexusops

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production-deploy:
    name: Production deploy
    runs-on:
      - self-hosted
      - nexusops-prod
    timeout-minutes: 45
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set executable permissions
        run: chmod +x scripts/*.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure runner dependencies
        run: ./scripts/ensure-runner-env.sh

      - name: Backend validation
        if: ${{ inputs.task != 'deploy-only' }}
        env:
          SKIP_BACKEND_DEP_INSTALL: "true"
        run: ./scripts/ci-backend.sh

      - name: Frontend validation
        if: ${{ inputs.task != 'deploy-only' }}
        env:
          SKIP_NPM_CI: "true"
        run: ./scripts/ci-frontend.sh

      - name: Prepare persistent production checkout
        run: |
          if [[ ! -d "$PRODUCTION_ROOT/.git" ]]; then
            echo "Production checkout is missing at $PRODUCTION_ROOT." >&2
            exit 1
          fi
          if [[ -n "$(git -C "$PRODUCTION_ROOT" status --short --untracked-files=no)" ]]; then
            echo "Tracked changes exist in $PRODUCTION_ROOT; refusing to overwrite them." >&2
            git -C "$PRODUCTION_ROOT" status --short
            exit 1
          fi
          git -C "$PRODUCTION_ROOT" fetch --prune origin main
          if [[ "$(git -C "$PRODUCTION_ROOT" rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "The dispatched commit does not match origin/main." >&2
            exit 1
          fi
          git -C "$PRODUCTION_ROOT" checkout --detach "$GITHUB_SHA"

      - name: Verify host-managed production env file
        run: |
          if [[ ! -s "$PRODUCTION_ROOT/.env" ]]; then
            echo "Production environment file is missing or empty at $PRODUCTION_ROOT/.env." >&2
            exit 1
          fi
          if [[ "$(stat -c '%a' "$PRODUCTION_ROOT/.env")" != "600" ]]; then
            echo "Production environment file must have mode 600." >&2
            exit 1
          fi

      - name: Validate Docker Compose config
        working-directory: ${{ env.PRODUCTION_ROOT }}
        run: ./scripts/deploy.sh --config-only

      - name: Deploy stack
        working-directory: ${{ env.PRODUCTION_ROOT }}
        env:
          BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_HEALTH_URL || 'http://localhost:8000/api/v1/health' }}
          FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'http://127.0.0.1:8080' }}
        run: ./scripts/deploy.sh
