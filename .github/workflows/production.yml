name: NexusOps Production Deployment

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose the production deployment task."
        required: true
        default: "validate-and-deploy"
        type: choice
        options:
          - validate-and-deploy
          - deploy-only

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production-deploy:
    name: Production deploy
    runs-on:
      - self-hosted
      - nexusops-prod
    timeout-minutes: 45
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set executable permissions
        run: chmod +x scripts/*.sh

      - name: Ensure runner dependencies
        run: ./scripts/ensure-runner-env.sh

      - name: Backend validation
        if: ${{ inputs.task != 'deploy-only' }}
        env:
          SKIP_BACKEND_DEP_INSTALL: "true"
        run: ./scripts/ci-backend.sh

      - name: Frontend validation
        if: ${{ inputs.task != 'deploy-only' }}
        env:
          SKIP_NPM_CI: "true"
        run: ./scripts/ci-frontend.sh

      - name: Create production env file
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE || secrets.NEXUSOPS_PRODUCTION_ENV_FILE }}
        run: |
          if [[ -z "$PRODUCTION_ENV_FILE" ]]; then
            echo "PRODUCTION_ENV_FILE is empty or unavailable to this workflow." >&2
            echo "Create a production environment or repository secret named PRODUCTION_ENV_FILE." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$PRODUCTION_ENV_FILE" > .env

      - name: Validate Docker Compose config
        run: ./scripts/deploy.sh --config-only

      - name: Deploy stack
        env:
          BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_HEALTH_URL || 'http://localhost:8000/api/v1/health' }}
          FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'http://localhost' }}
        run: ./scripts/deploy.sh
