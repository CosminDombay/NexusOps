[project]
name = "nexusops"
version = "0.1.0"
description = "Centralized infrastructure orchestration and automation platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "paramiko>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "sqlalchemy[asyncio]>=2.0.32",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.5"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.7"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
