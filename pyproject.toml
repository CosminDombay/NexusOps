[project]
name = "nexusops"
version = "0.1.0"
description = "Centralized infrastructure orchestration and automation platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "paramiko>=3.4.0,<6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.32",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.5"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.7"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501 is not enforced yet: ~1050 pre-existing long lines predate the linter
# being wired into CI, and reflowing them by hand is churn with no behavioural
# value. Everything else in this rule set is clean and gated in CI, so new code
# cannot regress it. Clear the backlog with `ruff format` when convenient, then
# drop this ignore.
# UP046 needs PEP 695 generics in BaseRepository; scheduled with that refactor.
ignore = ["E501", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
